name: Portfolio CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:schedule
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser regression (desktop and mobile)
        run: |
          npm run dev > /tmp/minlab-vite.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/ > /dev/null && break; sleep 1; done
          npm run test:browser
          MINLAB_TEST_URL=http://localhost:3000/ npm run test:motion
          MINLAB_TEST_URL=http://localhost:3000/ npm run test:chapters
          MINLAB_TEST_URL=http://localhost:3000/ npm run test:capabilities
          VITE_SUPABASE_URL=https://minlab-test.supabase.co VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_test npx vite --host 127.0.0.1 --port 3014 --strictPort > /tmp/minlab-remote-vite.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3014/ > /dev/null && break; sleep 1; done
          npm run test:remote
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-browser-evidence
          path: test-results/
