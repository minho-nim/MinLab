<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'"><title>MinFolder · 업무 자료지도</title><link rel="stylesheet" href="./style.css"><script type="module" src="./app.js"></script></head>
<body><header><div class="brand"><span class="mark">M</span><div><b>MinFolder</b><small>업무 자료지도</small></div></div><span class="local">내 PC에서만 처리</span></header>
<main><section class="hero"><div><p class="eyebrow">LOCAL WORKSPACE</p><h1>파일이 들어갈 곳을<br>한눈에.</h1><p>폴더를 연결하고, 저장 위치를 확인한 뒤 승인하세요.</p></div><div class="connections">
<div><span>01 원본 폴더</span><strong id="src-name">미연결</strong><button id="src">분류대기 연결</button></div>
<div><span>02 저장 폴더</span><strong id="dst-name">미연결</strong><button id="dst">저장 폴더 연결</button></div>
</div></section>
<p id="alert" role="status" aria-live="polite">연결한 원본 폴더에서만 이동할 수 있어요. 탐색기에서 놓은 파일은 복사만 돼요.</p>
<div class="board">
<section class="panel"><div class="heading"><div><p class="eyebrow">01 / MAP</p><h2>폴더 지도</h2></div><button id="refresh">새로고침</button></div>
<label class="sr" for="search">폴더 검색</label><input id="search" type="search" placeholder="계약명, 팀명, 폴더명 검색">
<div class="pinbar"><b>자주 쓰는 폴더</b><div id="pins"></div><button id="pin" disabled>선택 폴더 고정</button></div>
<p id="map-hint" class="hint">폴더 위에 파일을 놓으면 그 위치가 승인 목록에 들어가요.</p>
<div id="tree" aria-label="저장 폴더 목록"></div><p id="target" class="hint"></p></section>
<div class="right"><section class="panel input-panel"><div class="heading"><div><p class="eyebrow">02 / SORT</p><h2>파일 분류</h2></div></div>
<button id="drop" class="drop"><strong>파일을 여기에 놓으세요</strong><small>저장 위치 추천 · 클릭해서 파일 선택</small></button><input id="files" type="file" multiple hidden>
<details open><summary>분류대기 파일 <span id="in-count">0</span></summary><div class="inbox-nav"><button id="in-all" disabled>보이는 파일 모두 추천</button><span id="in-path" class="hint"></span><button id="in-back" hidden>상위로</button></div><div id="inbox"></div></details></section>
<section class="panel results"><div class="tabs"><button id="tab-queue" aria-pressed="true">분류 결과 <span id="q-count">0</span></button><button id="tab-history" aria-pressed="false">최근 넣은 파일</button></div>
<div id="queue-view"><div id="queue"></div><div class="actions"><span id="summary" class="hint"></span><button class="primary" id="approve" disabled>이동·복사 승인</button></div></div><div id="history-view" hidden><div id="history"></div></div></section></div>
</div></main><footer>MINFOLDER · 연결한 폴더 밖에는 접근하지 않아요.</footer></body></html>
