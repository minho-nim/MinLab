name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Verify catalog and saved-data migrations
        run: |
          npm run typecheck
          node --import tsx --test src/data/projectCatalog.test.ts src/utils/archive.test.ts src/utils/backupSnapshot.test.ts src/utils/projectLinkMigration.test.ts src/utils/riskAssessmentProject.test.ts

      - name: Build project
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Create 404 fallback for SPA
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04-arm
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published portfolio
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base = new URL(process.env.DEPLOYMENT_URL);
          base.pathname = base.pathname.replace(/\/?$/, '/');
          let lastError;
          for (let attempt = 0; attempt < 12; attempt++) {
            try {
              const request = async (path) => {
                const url = new URL(path, base);
                url.searchParams.set('deploy', process.env.DEPLOY_SHA);
                const response = await fetch(url);
                assert.ok(response.ok, `${response.status} ${url.pathname}`);
                return response;
              };
              const html = await (await request('./')).text();
              assert.match(html, /<title>MinLab/);
              const script = html.match(/<script[^>]+src="([^"]+)"/);
              assert.ok(script, 'Entry script is missing');
              const code = await (await request(script[1])).text();
              assert.ok(code.includes('https://minho-nim.github.io/Valumin/'), 'The new launch URL is not published yet');
              for (const path of ['media/minova-choice.webp', 'media/valumin-overview.webp', 'media/schedule-matching.jpg'])
                assert.match((await request(path)).headers.get('content-type'), /^image\//);
              assert.match(await (await request('apps/work-schedule/')).text(), /<script/);
              console.log(`공개 포트폴리오 검증 통과: ${base.href}`);
              process.exit(0);
            } catch (error) {
              lastError = error;
              if (attempt < 11) await new Promise(resolve => setTimeout(resolve, 5000));
            }
          }
          throw lastError;
          JS
