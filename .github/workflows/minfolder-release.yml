name: MinFolder Windows 앱 배포
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: minfolder-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/minfolder/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: main과 서명 키·새 버전 확인
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.MINFOLDER_UPDATER_PRIVATE_KEY }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo '::error::MINFOLDER_UPDATER_PRIVATE_KEY 저장소 Secret을 등록하세요.'; exit 1; }
          version=$(node -p "require('./apps/minfolder/desktop/package.json').version")
          if gh release view "minfolder-v${version}" >/dev/null 2>&1; then echo '::error::이미 배포한 버전입니다. 버전을 올려 주세요.'; exit 1; fi
      - run: npm ci --prefix apps/minfolder/desktop
      - run: npm --prefix apps/minfolder/desktop test
      - run: npm --prefix apps/minfolder/desktop run build
      - run: npx --prefix apps/minfolder/desktop playwright install chromium
      - run: npm --prefix apps/minfolder/desktop run test:browser
      - run: npm --prefix apps/minfolder/desktop run test:ui
      - run: cargo test --locked --manifest-path apps/minfolder/src-tauri/Cargo.toml --no-default-features --lib
      - name: 서명한 설치 파일 생성
        run: npm --prefix apps/minfolder/desktop run desktop:build -- -- --locked
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.MINFOLDER_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
      - name: 실제 Windows 앱 창 시작 확인
        shell: pwsh
        run: ./apps/minfolder/desktop/scripts/smoke-windows.ps1
      - name: 서명·버전 검증 및 업데이트 정보 생성
        run: |
          installer=$(find apps/minfolder/src-tauri/target/release/bundle/nsis -name '*-setup.exe' -print -quit)
          test -n "$installer"
          cargo run --locked --manifest-path apps/minfolder/src-tauri/Cargo.toml --no-default-features --features release-tools --example verify_update -- apps/minfolder/src-tauri/tauri.conf.json "$installer" "$installer.sig"
          node apps/minfolder/desktop/scripts/create-release.mjs "$installer" "$installer.sig" minfolder-release
      - name: 버전별 설치 파일과 전용 업데이트 채널 공개
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./apps/minfolder/desktop/package.json').version")
          tag="minfolder-v${version}"
          gh release create "$tag" --draft --target "$GITHUB_SHA" --latest=false --title "MinFolder Windows ${version}" --notes-file apps/minfolder/desktop/RELEASE-NOTES.md
          gh release upload "$tag" minfolder-release/MinFolder-Setup.exe minfolder-release/MinFolder-Setup.exe.sig minfolder-release/latest.json minfolder-release/SHA256SUMS
          gh release edit "$tag" --draft=false --latest=false
          if ! gh release view minfolder-updates >/dev/null 2>&1; then gh release create minfolder-updates --target "$GITHUB_SHA" --prerelease --latest=false --title 'MinFolder 자동 업데이트 채널' --notes 'MinFolder 전용 버전 정보입니다. 설치 파일은 버전별 릴리스에서 받으세요.'; fi
          gh release upload minfolder-updates minfolder-release/latest.json --clobber
