<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MinLab · 프로젝트 탐색 개선 비교</title><style>
:root{color-scheme:dark;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f0f0e8;background:#121715}*{box-sizing:border-box}body{margin:0;padding:32px 24px}main{max-width:1520px;margin:auto}a{color:inherit;text-underline-offset:4px}header{display:flex;justify-content:space-between;gap:24px;align-items:flex-start}h1{font-size:28px;font-weight:500;letter-spacing:-.03em;margin:12px 0}header p{font-size:14px;line-height:1.7;color:#c0c9c2;margin:0}.brand{font-size:16px;font-weight:600}.status{padding:8px 12px;border:1px solid #303c34;color:#b8d2bb;font-size:12px;white-space:nowrap}.changes{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0;font-size:13px;color:#c0c9c2}.changes span{border-left:2px solid #506354;padding-left:12px}nav{display:flex;gap:8px;margin:24px 0}button{font:inherit;font-size:14px;background:transparent;color:inherit;border:1px solid #506354;padding:10px 20px;cursor:pointer;border-radius:4px}button[aria-pressed=true]{color:#121715;background:#b8d2bb}button:focus-visible,a:focus-visible{outline:2px solid #b8d2bb;outline-offset:4px}.comparison-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;align-items:start;max-width:864px;margin:0 auto}.comparison-grid.desktop{max-width:none}figure{margin:0;min-width:0;background:#1c2420;border:1px solid #303c34}figcaption{padding:16px 20px;display:flex;justify-content:space-between;font-size:14px;border-bottom:1px solid #303c34}figcaption small{color:#a0afa4;font-size:12px}figure img{display:block;width:100%;height:auto}figure a{display:block}footer{font-size:12px;line-height:1.8;color:#a0afa4;margin:24px auto 0;max-width:864px}.note{font-size:13px;margin:20px 0;color:#a0afa4}@media(max-width:640px){body{padding:24px 16px}header{display:block}.status{display:inline-block;margin-top:16px}.comparison-grid{grid-template-columns:1fr}h1{font-size:24px}.changes{display:grid;gap:12px}figure img{max-width:390px;margin:auto}.comparison-grid.desktop figure img{max-width:none}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><main><header><div><a class="brand" href="../../#/home">MinLab.</a><h1>프로젝트 탐색 개선 비교</h1><p>모바일 대표 화면과 프로젝트 탐색 흐름을 개선한 시안입니다.</p></div><span class="status">운영 적용 전 · 비교 시안</span></header><div class="changes"><span>모바일 대표 화면 확대</span><span>앱·게임 대표작 구성</span><span>설명 길이에 맞춘 상세 구간</span></div><nav aria-label="비교할 화면 크기"><button type="button" data-width="390" aria-pressed="true">모바일</button><button type="button" data-width="1440" aria-pressed="false">데스크톱</button></nav><p class="note">이미지를 누르면 원본 크기로 열립니다. <a href="../../#/projects/proj-musclemap">상세 페이지도 살펴보기 ↗</a></p><section class="comparison-grid" aria-label="현재 화면과 정돈안 비교"><figure><figcaption>현재 <small>운영 디자인</small></figcaption><a id="before-link" href="before-390.webp" target="_blank" rel="noopener"><img id="before" src="before-390.webp" width="390" height="1000" alt="현재 MinLab 홈 화면"></a></figure><figure><figcaption>개선안 <small>세 가지 개선 적용</small></figcaption><a id="after-link" href="after-390.webp" target="_blank" rel="noopener"><img id="after" src="after-390.webp" width="390" height="1000" alt="프로젝트 탐색을 개선한 MinLab 홈 시안"></a></figure></section><footer><p>기존 색상·문구·실제 앱 화면을 유지하고 탐색 방식을 개선했습니다. 이 페이지는 미리보기 비교이며 운영 반영 전입니다.</p><p>Based on <a href="https://github.com/heydamir/unslop" target="_blank" rel="noopener">unslop by Damir Sokolovsky (@heydamir)</a> · CC BY 4.0</p></footer></main><script>
const buttons=Array.from(document.querySelectorAll('[data-width]'));for(const button of buttons)button.addEventListener('click',()=>{const width=button.dataset.width;for(const b of buttons)b.setAttribute('aria-pressed',String(b===button));document.querySelector('.comparison-grid').classList.toggle('desktop',width==='1440');for(const state of ['before','after']){const img=document.getElementById(state);img.src=state+'-'+width+'.webp';img.width=Number(width);document.getElementById(state+'-link').href=img.src}});
</script></body></html>
